name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trove_test
          POSTGRES_PASSWORD: trove_test
          POSTGRES_DB: trove_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trove_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://trove_test:trove_test@localhost:5432/trove_test
      SECRET_KEY: test-secret-key
      GOOGLE_CLIENT_ID: test-google-client-id
      TMDB_API_KEY: test-tmdb-key
      OPENAI_API_KEY: test-openai-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trove-backend-ci ./backend
      - run: docker build -t trove-frontend-ci --build-arg VITE_GOOGLE_CLIENT_ID=test ./frontend
      - run: docker build -t trove-combined-ci --build-arg VITE_GOOGLE_CLIENT_ID=test -f Dockerfile .
